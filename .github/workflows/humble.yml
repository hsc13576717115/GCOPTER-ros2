name: ROS 2 Humble
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      ROS_DOMAIN_ID: '83'
      ROS_LOCALHOST_ONLY: '1'
      MAKEFLAGS: '-j2'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pytest
          rosdep update --rosdistro humble
          rosdep install --from-paths gcopter map_gen --ignore-src --rosdistro humble -r -y
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --executor sequential --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Test actual nodes and geometry
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --executor sequential --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: humble-build-test-logs
          path: |
            log/
            build/*/test_results/
            build/*/Testing/Temporary/
            build/*/ament_cmake_pytest/
            /tmp/pytest-of-root/
